name: Deploy
run-name: ${{ gitea.actor }} is deploying ${{ gitea.repository }}
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: host
    env:
      DART_SASS_VERSION: 1.98.0
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true

      - name: Install Dart Sass
        uses: dw-labs-org/dart-sass-gha@v1

      - name: Build site
        run: |
          hugo build --gc --minify --baseURL https://kaddish.post-self.ink --destination /opt/hugo/kaddish.post-self.ink

      - name: Set permissions
        run: chown -R www-data:www-data /opt/hugo/kaddish.post-self.ink
